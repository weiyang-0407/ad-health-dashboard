<style>
:root{color-scheme:light;--bg:#f0f2f8;--card:#fff;--text:#1a1a2e;--muted:#666}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--text);padding:14px;font-size:14px}
.header{background:#fff;border-radius:12px;padding:14px 18px;margin-bottom:12px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;box-shadow:0 1px 4px rgba(0,0,0,.08)}

.client-select{padding:7px 12px;border-radius:8px;border:1px solid #dbe0f0;font-size:13px;font-weight:700;color:var(--text);background:#fff;cursor:pointer}

.refresh-btn:hover{background:#3451c0}.refresh-btn:disabled{background:#b0b8d4;cursor:not-allowed}

.s-warn{background:#fef9c3;border:1px solid #fde047;color:#92400e}

.card{background:#fff;border-radius:10px;padding:13px 15px;box-shadow:0 1px 4px rgba(0,0,0,.07)}
.card-label{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin-bottom:4px}
.card-val{font-size:20px;font-weight:900;line-height:1.1}.card-sub{font-size:10px;color:var(--muted);margin-top:3px}
.section{background:#fff;border-radius:12px;padding:14px;box-shadow:0 1px 4px rgba(0,0,0,.07);margin-bottom:12px}
.section-title{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.4px;margin-bottom:12px;color:#444}
.chart-wrap{height:150px;position:relative}
table{width:100%;border-collapse:collapse;font-size:12px}
th{text-align:left;padding:7px 9px;background:#f5f7ff;color:#555;font-weight:700;font-size:10px;text-transform:uppercase;letter-spacing:.3px;border-bottom:2px solid #e8ebf5;white-space:nowrap}

tr:last-child td{border-bottom:none}tr:hover td{background:#f9faff}

.b-active{background:#dcfce7;color:#14532d}.b-paused{background:#fef9c3;color:#713f12}.b-nospend{background:#fee2e2;color:#991b1b}
.result-chip{background:#fef9c3;color:#713f12;padding:2px 7px;border-radius:6px;font-weight:700;font-size:11px}
.dl-ok{background:#dcfce7;color:#14532d;padding:2px 6px;border-radius:5px;font-size:10px;font-weight:600}
.dl-warn{background:#fef9c3;color:#92400e;padding:2px 6px;border-radius:5px;font-size:10px;font-weight:700}
.dl-urgent{background:#fee2e2;color:#991b1b;padding:2px 6px;border-radius:5px;font-size:10px;font-weight:700}
.dl-ended{background:#e5e7eb;color:#6b7280;padding:2px 6px;border-radius:5px;font-size:10px;font-weight:600}
.plat-hdr{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.5px;padding:5px 9px;border-radius:5px;margin-bottom:7px;display:inline-block}
.ph-meta{background:#dbeafe;color:#1e40af}.ph-google{background:#dcfce7;color:#14532d}.ph-tiktok{background:#f3f4f6;color:#374151}
.plat-block{margin-bottom:14px}
.loading{background:#fff;border-radius:12px;padding:50px 20px;text-align:center;box-shadow:0 1px 4px rgba(0,0,0,.08)}
.spinner{border:3px solid #e8ebf5;border-top-color:#4263eb;border-radius:50%;width:28px;height:28px;animation:spin .6s linear infinite;margin:0 auto 10px}
@keyframes spin{to{transform:rotate(360deg)}}
.err-box{background:#fee2e2;border:1px solid #fca5a5;border-radius:8px;padding:12px 14px;color:#991b1b;font-size:12px;margin-bottom:12px}
.no-data{padding:20px;text-align:center;color:var(--muted);font-size:13px}
.warn-cell{color:#dc2626;font-weight:700}.good-cell{color:#16a34a}
.camp-name{max-width:240px;word-break:break-word;line-height:1.3;font-weight:600}
.budget-cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.budget-card{border-radius:10px;padding:13px 15px;color:#fff}
.bc-meta{background:linear-gradient(135deg,#4285f4,#2f5fc4)}
.bc-google{background:linear-gradient(135deg,#34a853,#1f7a3a)}
.bc-tiktok{background:linear-gradient(135deg,#333,#111)}
.bc-total{background:linear-gradient(135deg,#6b46c1,#4527a0)}
.bc-label{font-size:10px;text-transform:uppercase;letter-spacing:.5px;opacity:.85;margin-bottom:4px}
.bc-val{font-size:19px;font-weight:900;line-height:1.1}
.bc-sub{font-size:10px;opacity:.8;margin-top:3px}
.footer-note{font-size:10px;color:var(--muted);text-align:center;padding:10px 0}
</style>
</head>
<body>
<div class="header">
  <div><h1 id="hdr-title">All Accounts</h1><div class="sub" id="hdr-sub">Loading data...</div></div>
  <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap">
    <select class="client-select" id="client-select" onchange="onClientChange()"></select>
    <span style="font-size:11px;color:var(--muted)" id="hdr-time"></span>
    <button class="refresh-btn" id="btn-refresh" onclick="loadData()">&#8635; Refresh</button>
  </div>
</div>
<div id="status-bar"></div>
<div id="client-err"></div>
<div class="cards" id="cards" style="display:none"></div>
<div id="loading" class="loading"><div class="spinner"></div><p style="font-size:13px;color:var(--muted)">Loading from Google Sheets...</p></div>
<div id="main" style="display:none">
  <div class="section">
    <div class="section-title">Total Budget by Platform &mdash; Latest Day</div>
    <div class="budget-cards" id="budget-cards"></div>
  </div>
  <div class="section">
    <div class="section-title" id="trend-title">Spend Trend (RM)</div>
    <div class="chart-wrap"><canvas id="trend-chart"></canvas></div>
  </div>
  <div class="section">
    <div class="section-title" id="table-title">Latest Day &mdash; Campaign Breakdown</div>
    <div id="camp-table"></div>
  </div>
</div>
<div class="footer-note">Data source: shared Google Sheet (read-only) &middot; not affiliated with Cowork</div>
<script>
const SHEET_ID="19UTdyx8sdTJ5h4SXOTxj4UeGmTfhzRSAlPpDxfTiktE";
// Each client's data lives in its own tab within the same spreadsheet.
const CLIENTS=[
  {"clientName":"ERAT","sheetName":"ERAT"},
  {"clientName":"Paramount Property","sheetName":"Paramount"},
  {"clientName":"Snow Brand","sheetName":"Snow Brand"},
  {"clientName":"Ergoworks","sheetName":"Ergoworks"},
  {"clientName":"Cendol","sheetName":"Cendol"},
  {"clientName":"XXELL.AI","sheetName":"XXELL.AI"},
  {"clientName":"iQurious","sheetName":"iQurious","strict":true,"patterns":["iqurious"]}
];
let CONFIG=CLIENTS[0];
let cachedByClient={}; // clientName -> array of parsed row objects
const PLAT_COLORS={Meta:"#4285f4",Google:"#34a853",TikTok:"#555555"};

// Loaded via a <script> tag (JSONP), not fetch() — this avoids CORS/file://
// restrictions entirely so the dashboard works even when double-clicked
// locally, with no web server needed.
let jsonpCounter=0;
function loadSheetJSONP(sheetName){
  return new Promise((resolve,reject)=>{
    const cbName="__sheetCb"+(jsonpCounter++);
    const script=document.createElement("script");
    const timeout=setTimeout(()=>{cleanup();reject(new Error("Timed out loading \""+sheetName+"\""));},15000);
    function cleanup(){
      clearTimeout(timeout);
      delete window[cbName];
      if(script.parentNode)script.parentNode.removeChild(script);
    }
    window[cbName]=function(json){cleanup();resolve(json);};
    script.onerror=function(){cleanup();reject(new Error("Failed to load \""+sheetName+"\""));};
    script.src="https://docs.google.com/spreadsheets/d/"+SHEET_ID+"/gviz/tq?tqx=out:json;responseHandler:"+cbName+"&sheet="+encodeURIComponent(sheetName);
    document.head.appendChild(script);
  });
}

// ── Days-left helpers ────────────────────────────────────────────────────────
function parseCampaignEndDate(name){
  const YEAR=2026;
  const MON={jan:1,feb:2,mar:3,apr:4,may:5,jun:6,jul:7,aug:8,sep:9,oct:10,nov:11,dec:12};
  function monNum(s){return MON[(s||'').substring(0,3).toLowerCase()]||0;}
  const n=name.toLowerCase();
  const nd=[...n.matchAll(/(\d{1,2})\s+(jan\w*|feb\w*|mar\w*|apr\w*|may|jun\w*|jul\w*|aug\w*|sep\w*|oct\w*|nov\w*|dec\w*)\s*(\d{4})?/g)];
  if(nd.length>0){
    const last=nd[nd.length-1];
    const m=monNum(last[2]);
    if(m){const y=last[3]?parseInt(last[3]):YEAR;return new Date(y,m-1,parseInt(last[1]));}
  }
  const sd=[...n.matchAll(/(\d{1,2})\/(\d{1,2})(?:\/(\d{2,4}))?/g)];
  if(sd.length>0){
    const last=sd[sd.length-1];
    let y=last[3]?parseInt(last[3]):YEAR;
    if(y<100)y+=2000;
    return new Date(y,parseInt(last[2])-1,parseInt(last[1]));
  }
  const m4=n.match(/(jan\w*|feb\w*|mar\w*|apr\w*|may|jun\w*|jul\w*|aug\w*|sep\w*|oct\w*|nov\w*|dec\w*)\s*'?\s*(\d{4})/);
  if(m4){const m=monNum(m4[1]);if(m)return new Date(parseInt(m4[2]),m,0);}
  return null;
}

function daysLeftHtml(campaign, status, apiEndDate, latestDateStr){
  let endDate=null;
  if(apiEndDate&&apiEndDate.match(/^\d{4}-\d{2}-\d{2}$/)){
    const parts=apiEndDate.split('-');
    endDate=new Date(parseInt(parts[0]),parseInt(parts[1])-1,parseInt(parts[2]));
  } else {
    endDate=parseCampaignEndDate(campaign);
  }
  if(!endDate)return '&mdash;';
  const ref=new Date(latestDateStr);
  const diff=Math.ceil((endDate-ref)/(1000*60*60*24));
  if(diff<0&&status.toUpperCase()==='ACTIVE')return '&mdash;';
  if(diff<0)return '<span class="dl-ended">Ended</span>';
  if(diff===0)return '<span class="dl-urgent">Last day</span>';
  if(diff<=3)return '<span class="dl-urgent">'+diff+'d left</span>';
  if(diff<=7)return '<span class="dl-warn">'+diff+'d left</span>';
  return '<span class="dl-ok">'+diff+'d left</span>';
}

// ── Google Visualization ("gviz") JSON table parser ─────────────────────────
// Cell values come back as {v: rawValue, f: formattedString}. Date-typed
// cells serialize v as "Date(YYYY,M,D)" (zero-indexed month) — normalize
// those to plain YYYY-MM-DD so the rest of the app can treat every field as
// a plain string/number, same shape as before.
function cellStr(cell){
  if(!cell)return '';
  let v=(cell.f!=null)?cell.f:cell.v;
  if(v==null)return '';
  if(typeof v==='string'){
    const m=v.match(/^Date\((\d+),(\d+),(\d+)\)$/);
    if(m){
      const y=+m[1],mo=+m[2]+1,d=+m[3];
      return y+'-'+String(mo).padStart(2,'0')+'-'+String(d).padStart(2,'0');
    }
    return v;
  }
  return String(v);
}

function parseClientTable(json, clientCfg){
  if(!json||!json.table||!Array.isArray(json.table.rows))return [];
  // Google's gviz endpoint does NOT reliably detect our first row as a header
  // row (json.table.cols[].label comes back empty) — it shows up as an
  // ordinary data row instead. So we address columns by fixed position
  // (confirmed via live check: A=Date, B=Platform, ... O=Budget Type) rather
  // than by label. The literal "Date" header row is harmless: it fails the
  // date-regex check below just like the "7-DAY" summary rows do, so it's
  // skipped automatically without special-casing.
  const iDate=0,iPlat=1,iCamp=2,iStatus=3,iSpend=4,iImpr=5,iClicks=6,iCtr=7,
    iCpm=8,iCpc=9,iRoas=10,iResult=11,iEnd=12,iBudget=13,iBType=14;
  const rows=[];
  json.table.rows.forEach(row=>{
    const c=row.c||[];
    const get=i=>i>=0?cellStr(c[i]):'';
    const date=get(iDate).trim();
    if(!date.match(/^\d{4}-\d{2}-\d{2}$/))return; // skips header row + "7-DAY" summary rows
    const camp=get(iCamp).trim();
    if(camp.includes("TOTAL"))return; // skips "── META TOTAL ──" style rows
    const spend=parseFloat(get(iSpend))||0;
    if(spend<=0)return;
    if(clientCfg.strict&&clientCfg.patterns&&
       !clientCfg.patterns.some(p=>camp.toLowerCase().includes(p.toLowerCase())))return;
    rows.push({date,platform:get(iPlat).trim(),campaign:camp,status:get(iStatus).trim(),spend,
      impr:parseInt(get(iImpr))||0,clicks:parseInt(get(iClicks))||0,
      ctr:parseFloat(get(iCtr))||0,cpm:parseFloat(get(iCpm))||0,
      cpc:parseFloat(get(iCpc))||0,roas:parseFloat(get(iRoas))||0,
      result:parseFloat(get(iResult))||0,
      endDate:get(iEnd).trim(),
      budget:parseFloat(get(iBudget))||0,
      budgetType:get(iBType).trim()});
  });
  return rows;
}

function process(rows){
  const dates=[...new Set(rows.map(r=>r.date))].sort();
  const latest=dates.at(-1);
  const dayRows=rows.filter(r=>r.date===latest);
  const platforms=[...new Set(dayRows.map(r=>r.platform))];
  const byPlatSpend={};
  dayRows.forEach(r=>byPlatSpend[r.platform]=(byPlatSpend[r.platform]||0)+r.spend);
  const byPlatBudget={};
  dayRows.forEach(r=>{if(r.budget>0)byPlatBudget[r.platform]=(byPlatBudget[r.platform]||0)+r.budget;});
  const byPlatBudgetKind={};
  dayRows.forEach(r=>{
    if(r.budget<=0)return;
    const kind=(r.platform==='Google'&&r.budgetType!=='T')?'D':'T';
    if(!byPlatBudgetKind[r.platform])byPlatBudgetKind[r.platform]=kind;
    else if(byPlatBudgetKind[r.platform]!==kind)byPlatBudgetKind[r.platform]='MIXED';
  });
  const totalBudget=Object.values(byPlatBudget).reduce((s,v)=>s+v,0);
  const totalSpend=dayRows.reduce((s,r)=>s+r.spend,0);
  const totalImpr=dayRows.reduce((s,r)=>s+r.impr,0);
  const totalClicks=dayRows.reduce((s,r)=>s+r.clicks,0);
  const totalResult=dayRows.reduce((s,r)=>s+r.result,0);
  const active=dayRows.filter(r=>r.status.toUpperCase()==="ACTIVE").length;
  const paused=dayRows.filter(r=>r.status.toUpperCase()!=="ACTIVE").length;
  const trend=dates.map(d=>{
    const dr=rows.filter(r=>r.date===d);
    const byP={};
    dr.forEach(r=>byP[r.platform]=(byP[r.platform]||0)+r.spend);
    return{date:d,byP};
  });
  const trendPlats=[...new Set(trend.flatMap(t=>Object.keys(t.byP)))];
  return{latest,dayRows,platforms,byPlatSpend,byPlatBudget,byPlatBudgetKind,totalBudget,totalSpend,totalImpr,totalClicks,totalResult,active,paused,trend,trendPlats,dates};
}

let trendChart=null;
const fmt=(n,d=2)=>(+n||0).toFixed(d);
const fmtI=n=>Math.round(+n||0).toLocaleString();

function renderStatus(d){
  const el=document.getElementById("status-bar");
  if(d.paused>0&&d.active===0)
    el.innerHTML='<div class="status s-crit">&#9888; All campaigns paused &mdash; '+d.latest+'</div>';
  else if(d.paused>0)
    el.innerHTML='<div class="status s-warn">&#9889; '+d.active+' active / '+d.paused+' paused &mdash; '+d.latest+'</div>';
  else
    el.innerHTML='<div class="status s-ok">&#10003; '+d.active+' campaign'+(d.active!==1?'s':'')+' active &mdash; '+d.latest+'</div>';
}

function renderCards(d){
  const platBreak=Object.entries(d.byPlatSpend).map(([p,v])=>p+' RM'+fmt(v)).join(' &middot; ');
  const ctr=d.totalImpr>0?(d.totalClicks/d.totalImpr*100).toFixed(2):'0.00';
  let h='<div class="card"><div class="card-label">Total Spend</div><div class="card-val">RM '+fmt(d.totalSpend)+'</div><div class="card-sub">'+platBreak+'</div></div>'
    +'<div class="card"><div class="card-label">Impressions</div><div class="card-val">'+fmtI(d.totalImpr)+'</div><div class="card-sub">CTR '+ctr+'%</div></div>'
    +'<div class="card"><div class="card-label">Clicks</div><div class="card-val">'+fmtI(d.totalClicks)+'</div><div class="card-sub">'+d.latest+'</div></div>';
  if(d.totalResult>0)
    h+='<div class="card"><div class="card-label">Results</div><div class="card-val">'+fmtI(d.totalResult)+'</div><div class="card-sub">Leads / conversions</div></div>';
  h+='<div class="card"><div class="card-label">Campaigns</div><div class="card-val">'+(d.active+d.paused)+'</div><div class="card-sub">'+d.active+' active &middot; '+d.paused+' paused</div></div>';
  const el=document.getElementById("cards");
  el.innerHTML=h;el.style.display="grid";
}

function renderBudgetCards(d){
  const el=document.getElementById("budget-cards");
  if(!d.totalBudget||d.totalBudget<=0){
    el.innerHTML='<div class="no-data">No budget data available for '+d.latest+'. Budget is shown once campaigns have a daily or lifetime budget configured.</div>';
    return;
  }
  const cls={Meta:'bc-meta',Google:'bc-google',TikTok:'bc-tiktok'};
  let h='';
  ['Meta','Google','TikTok'].forEach(function(p){
    if(d.byPlatBudget[p]>0){
      const kind=d.byPlatBudgetKind[p];
      const note=kind==='D'?' (Daily)':(kind==='MIXED'?' (Mixed Daily+Total)':'');
      h+='<div class="budget-card '+(cls[p]||'bc-total')+'"><div class="bc-label">'+p+' Total Budget'+note+'</div>'
        +'<div class="bc-val">RM '+fmtI(d.byPlatBudget[p])+(kind==='D'?' (Daily)':'')+'</div>'
        +'<div class="bc-sub">Spend so far: RM '+fmt(d.byPlatSpend[p]||0)+'</div></div>';
    }
  });
  h+='<div class="budget-card bc-total"><div class="bc-label">Grand Total Budget</div>'
    +'<div class="bc-val">RM '+fmtI(d.totalBudget)+'</div>'
    +'<div class="bc-sub">'+d.latest+'</div></div>';
  el.innerHTML=h;
}

function renderTrend(d){
  const ctx=document.getElementById("trend-chart").getContext("2d");
  const labels=d.trend.map(t=>t.date.slice(5));
  const datasets=d.trendPlats.map(p=>({
    label:p,data:d.trend.map(t=>+(t.byP[p]||0).toFixed(2)),
    backgroundColor:PLAT_COLORS[p]||"#888",borderRadius:4,borderSkipped:false,
  }));
  if(trendChart)trendChart.destroy();
  trendChart=new Chart(ctx,{
    type:"bar",data:{labels,datasets},
    options:{responsive:true,maintainAspectRatio:false,
      plugins:{legend:{position:"top",labels:{font:{size:11}}}},
      scales:{
        x:{stacked:false,grid:{display:false},ticks:{font:{size:11}}},
        y:{stacked:false,grid:{color:"#f0f2f8"},ticks:{font:{size:11},callback:function(v){return "RM"+v.toFixed(0);}}},
      }}
  });
}

function renderTable(d){
  document.getElementById("table-title").textContent=d.latest+' — Campaign Breakdown';
  let h='';
  d.platforms.forEach(function(plat){
    const rows=d.dayRows.filter(function(r){return r.platform===plat;});
    const pcls=plat==='Meta'?'ph-meta':plat==='Google'?'ph-google':'ph-tiktok';
    h+='<div class="plat-block"><div class="plat-hdr '+pcls+'">'+plat+'</div>'
      +'<table><thead><tr>'
      +'<th>Campaign</th><th class="td-c">Days Left</th><th>Status</th>'
      +'<th class="td-r">Budget</th>'
      +'<th class="td-r">Spend</th><th class="td-r">Impr.</th><th class="td-r">Clicks</th>'
      +'<th class="td-r">CTR%</th><th class="td-r">CPM</th><th class="td-r">CPC</th>'
      +'<th class="td-r">ROAS</th><th class="td-r">Result</th>'
      +'</tr></thead><tbody>';
    rows.forEach(function(r){
      const sta=r.status.toUpperCase()==='ACTIVE'?'ACTIVE':(r.status.toUpperCase()==='NO SPEND'?'NO SPEND':(r.status||'PAUSED'));
      const sCls=sta==='ACTIVE'?'b-active':(sta==='NO SPEND'?'b-nospend':'b-paused');
      const ctrCls=r.ctr<0.5?'warn-cell':r.ctr>=2?'good-cell':'';
      const cpmCls=r.cpm>30?'warn-cell':(r.cpm>0&&r.cpm<=10)?'good-cell':'';
      const resultHtml=r.result>0?'<span class="result-chip">'+fmtI(r.result)+'</span>':'&mdash;';
      const dlHtml=daysLeftHtml(r.campaign,r.status,r.endDate,d.latest);
      const isDaily=plat==='Google'&&r.budgetType!=='T';
      const budgetHtml=r.budget>0?('RM '+fmt(r.budget)+(isDaily?' <span style="color:#888;font-weight:400">(Daily)</span>':'')):'&mdash;';
      h+='<tr>'
        +'<td class="camp-name">'+r.campaign+'</td>'
        +'<td class="td-c">'+dlHtml+'</td>'
        +'<td><span class="badge '+sCls+'">'+sta+'</span></td>'
        +'<td class="td-r">'+budgetHtml+'</td>'
        +'<td class="td-r">RM '+fmt(r.spend)+'</td>'
        +'<td class="td-r">'+fmtI(r.impr)+'</td>'
        +'<td class="td-r">'+fmtI(r.clicks)+'</td>'
        +'<td class="td-r '+ctrCls+'">'+fmt(r.ctr)+'%</td>'
        +'<td class="td-r '+cpmCls+'">'+(r.cpm>0?fmt(r.cpm):'&mdash;')+'</td>'
        +'<td class="td-r">'+(r.cpc>0?'RM '+fmt(r.cpc):'&mdash;')+'</td>'
        +'<td class="td-r">'+(r.roas>0?fmt(r.roas):'&mdash;')+'</td>'
        +'<td class="td-r">'+resultHtml+'</td>'
        +'</tr>';
    });
    h+='</tbody></table></div>';
  });
  document.getElementById("camp-table").innerHTML=h||'<div class="no-data">No campaign data for this date.</div>';
}

// ── Client selector setup ───────────────────────────────────────────────────
function setupSelect(){
  const sel=document.getElementById("client-select");
  sel.innerHTML=CLIENTS.map(c=>'<option value="'+c.clientName+'">'+c.clientName+'</option>').join('');
  let saved=null;
  try{saved=localStorage.getItem('adHealthClient');}catch(e){}
  const found=CLIENTS.find(c=>c.clientName===saved);
  if(found){CONFIG=found;sel.value=found.clientName;}
  else{sel.value=CONFIG.clientName;}
}

function onClientChange(){
  const sel=document.getElementById("client-select");
  const found=CLIENTS.find(c=>c.clientName===sel.value);
  if(found)CONFIG=found;
  try{localStorage.setItem('adHealthClient',CONFIG.clientName);}catch(e){}
  renderClient();
}

function renderClient(){
  document.getElementById("status-bar").innerHTML="";
  document.getElementById("client-err").innerHTML="";
  document.getElementById("cards").style.display="none";
  document.getElementById("hdr-title").textContent=CONFIG.clientName;
  try{
    const clientRows=cachedByClient[CONFIG.clientName];
    if(!clientRows||clientRows.length===0)
      throw new Error('No data found for "'+CONFIG.clientName+'".');
    const d=process(clientRows);
    document.getElementById("hdr-sub").textContent='Latest: '+d.latest+' · '+d.dates.length+' days tracked';
    renderStatus(d);renderCards(d);
    document.getElementById("main").style.display="block";
    renderBudgetCards(d);renderTrend(d);renderTable(d);
  }catch(err){
    document.getElementById("main").style.display="none";
    document.getElementById("client-err").innerHTML='<div class="err-box">&#10060; Error: '+err.message+'</div>';
  }
}

// ── Load every client's own tab in parallel via JSONP, cache, then render ──
async function loadData(){
  const btn=document.getElementById("btn-refresh");
  btn.disabled=true;
  document.getElementById("loading").style.display="block";
  document.getElementById("loading").innerHTML='<div class="spinner"></div><p style="font-size:13px;color:var(--muted)">Loading from Google Sheets...</p>';
  document.getElementById("main").style.display="none";
  document.getElementById("status-bar").innerHTML="";
  document.getElementById("client-err").innerHTML="";
  document.getElementById("cards").style.display="none";
  try{
    const results=await Promise.all(CLIENTS.map(async c=>{
      try{
        const json=await loadSheetJSONP(c.sheetName);
        return {name:c.clientName, rows:parseClientTable(json,c)};
      }catch(e){
        return {name:c.clientName, rows:[], error:e.message};
      }
    }));
    cachedByClient={};
    let anyOk=false;
    const errors=[];
    results.forEach(r=>{
      cachedByClient[r.name]=r.rows;
      if(r.rows.length)anyOk=true;
      if(r.error)errors.push(r.name+': '+r.error);
    });
    if(!anyOk)throw new Error("Could not load data from any account."+(errors.length?" ("+errors[0]+")":"")+" Make sure the Google Sheet is shared as \"Anyone with the link — Viewer\".");
    document.getElementById("hdr-time").textContent='Updated '+new Date().toLocaleTimeString();
    document.getElementById("loading").style.display="none";
    renderClient();
  }catch(err){
    document.getElementById("loading").innerHTML='<div class="err-box">&#10060; Error: '+err.message+'</div>';
  }
  btn.disabled=false;
}

setupSelect();
loadData();
</script>
